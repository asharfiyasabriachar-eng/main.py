name: Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Dailymotion Video URL'
        required: true
        default: 'YOUR_DAILYMOTION_VIDEO_URL_HERE'

jobs:
  run-dubbing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp edge-tts

      - name: Run Dubbing Script
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          python main.py
